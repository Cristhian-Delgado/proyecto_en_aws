name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "demo/**"]
  pull_request:
    branches: [main]

jobs:
  pruebas-y-build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Construir el proyecto
        run: npm run build

      - name: Guardar el resultado del build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
