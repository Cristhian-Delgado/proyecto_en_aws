<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario de registro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Crear cuenta</h1>
    <p class="intro">Comentarios. Los campos se validan mientras escribes.</p>

    <form id="formulario" novalidate>
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" autocomplete="name">
        <small class="error" id="error-nombre"></small>
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" autocomplete="email">
        <small class="error" id="error-correo"></small>
      </div>

      <div class="fila">
        <div class="campo">
          <label for="cedula">Cédula</label>
          <input type="text" id="cedula" name="cedula" inputmode="numeric" maxlength="10">
          <small class="error" id="error-cedula"></small>
        </div>
        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" inputmode="numeric" maxlength="10" placeholder="09XXXXXXXX">
          <small class="error" id="error-telefono"></small>
        </div>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="new-password">
        <small class="ayuda">Mínimo 8 caracteres, con mayúscula, minúscula y número.</small>
        <small class="error" id="error-password"></small>
      </div>

      <div class="campo">
        <label for="confirmar">Repetir contraseña</label>
        <input type="password" id="confirmar" name="confirmar" autocomplete="new-password">
        <small class="error" id="error-confirmar"></small>
      </div>

      <div class="campo check">
        <label class="check-label">
          <input type="checkbox" id="terminos" name="terminos">
          <span>Acepto los términos y condiciones</span>
        </label>
        <small class="error" id="error-terminos"></small>
      </div>

      <button type="submit">Crear cuenta</button>
      <p class="exito" id="mensaje-exito" role="status" hidden></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
